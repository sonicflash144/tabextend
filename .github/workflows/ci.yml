name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes the run already in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - run: npm test

      # Runs webpack itself before staging, so this covers `npm run build` as
      # well as the per-browser manifest merges and zips.
      - run: npm run build:browsers
